<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5C9BD1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g id="TornadoChart">
    <!-- Center axis line -->
    <line x1="10" y1="1" x2="10" y2="19" stroke="#666" stroke-width="0.5" opacity="0.6"/>
    <!-- Left bars (green) - extending from center to left -->
    <rect x="2" y="2" width="8" height="3" rx="0.5" fill="url(#leftGrad)"/>
    <rect x="4" y="6" width="6" height="3" rx="0.5" fill="url(#leftGrad)"/>
    <rect x="5" y="10" width="5" height="3" rx="0.5" fill="url(#leftGrad)"/>
    <rect x="3" y="14" width="7" height="3" rx="0.5" fill="url(#leftGrad)"/>
    <!-- Right bars (blue) - extending from center to right -->
    <rect x="10" y="2" width="7" height="3" rx="0.5" fill="url(#rightGrad)"/>
    <rect x="10" y="6" width="5" height="3" rx="0.5" fill="url(#rightGrad)"/>
    <rect x="10" y="10" width="8" height="3" rx="0.5" fill="url(#rightGrad)"/>
    <rect x="10" y="14" width="4" height="3" rx="0.5" fill="url(#rightGrad)"/>
  </g>
</svg>
